<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xqi18n browser (UMD) test</title>
    <link rel="icon" href="./test-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./demo.css">
</head>

<body>
    <header class="test-header">
        <div class="test-brand">
            <img class="test-brand-icon" src="./test-icon.svg" alt="" width="20" height="20">
            xqi18n <span>test pages</span>
        </div>
        <nav class="test-nav" aria-label="Test pages">
            <a href="./index.html">Index</a>
            <a href="./browser.html" aria-current="page">Browser</a>
            <a href="./esm.html">ESM</a>
            <a href="./vue2.html">Vue 2</a>
            <a href="./vue3.html">Vue 3</a>
        </nav>
    </header>

    <main class="test-main">
        <section class="panel">
            <h1>UMD build</h1>
            <p class="test-lead">
                Loads <code>../lib/xqi18n.min.js</code> as a classic script and runs the shared
                behaviour suite against <code>window.xqi18n</code>.
            </p>
            <div id="summary" class="status-badge is-running" aria-live="polite">RUNNING</div>
            <ul id="checks" class="check-list"></ul>
            <p id="details" class="test-details"></p>
        </section>

        <section class="panel">
            <h2>Live demo</h2>
            <p class="test-lead">Switching language must not reload the page.</p>
            <div class="demo-panel">
                <p class="demo-line"><span>name</span><strong id="demo-name"></strong></p>
                <p class="demo-line"><span>a.b.d.e (nested)</span><strong id="demo-nested"></strong></p>
                <p class="demo-line"><span>missing.key</span><strong id="demo-missing"></strong></p>
            </div>
            <div class="demo-controls">
                <button type="button" data-lang="zhCn">中文</button>
                <button type="button" data-lang="enUs">English</button>
                <button type="button" data-lang="frFr">Unknown language</button>
            </div>
        </section>
    </main>

    <script src="../lib/xqi18n.min.js"></script>
    <script type="module">
        import { createCheckRunner, assert } from './checks.js';
        import { messages } from './fixtures.mjs';
        import { createChecks } from './shared-suite.mjs';

        const runner = createCheckRunner({ page: 'umd' });

        const checks = [
            ['global constructor is not an interop wrapper', () => {
                assert(typeof window.xqi18n === 'function', 'window.xqi18n is not a function');
                assert(window.xqi18n.default === undefined, 'window.xqi18n is wrapped in { default }');
                assert(window.Xqi18n === undefined, 'a second global name leaked');
            }],
            ...createChecks(window.xqi18n),
        ];

        await runner.run(checks);

        // The interactive demo is mounted after the suite so the page never ends
        // in an empty state.
        const i18n = new window.xqi18n({ lang: 'zhCn', messages });
        const render = () => {
            document.querySelector('#demo-name').textContent = i18n.tns('name');
            document.querySelector('#demo-nested').textContent = i18n.tns('a.b.d.e');
            document.querySelector('#demo-missing').textContent = i18n.tns('missing.key');
        };
        render();
        for (const button of document.querySelectorAll('[data-lang]')) {
            button.addEventListener('click', () => {
                i18n.lang = button.dataset.lang;
                render();
            });
        }
        runner.markDemoReady();
    </script>
</body>

</html>
