<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xqi18n Vue 3 test</title>
    <link rel="icon" href="./test-icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./demo.css">
</head>

<body>
    <header class="test-header">
        <div class="test-brand">
            <img class="test-brand-icon" src="./test-icon.svg" alt="" width="20" height="20">
            xqi18n <span>test pages</span>
        </div>
        <nav class="test-nav" aria-label="Test pages">
            <a href="./index.html">Index</a>
            <a href="./browser.html">Browser</a>
            <a href="./esm.html">ESM</a>
            <a href="./vue2.html">Vue 2</a>
            <a href="./vue3.html" aria-current="page">Vue 3</a>
        </nav>
    </header>

    <main class="test-main" data-vue-major="3">
        <section class="panel">
            <h1>Vue 3 plugin</h1>
            <p class="test-lead">
                Loads the Vue 3 runtime from a pinned CDN and the committed bundles from
                <code>../lib/</code>, then mounts one app with one instance.
            </p>
            <div id="summary" class="status-badge is-running" aria-live="polite">RUNNING</div>
            <ul id="checks" class="check-list"></ul>
            <p id="details" class="test-details"></p>
        </section>

        <section class="panel">
            <h2>Live demo</h2>
            <p class="test-lead">Both the template helper and <code>inject()</code> follow the language.</p>
            <div id="vue-demo"></div>
            <div class="demo-controls">
                <button type="button" data-lang="zhCn">中文</button>
                <button type="button" data-lang="enUs">English</button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.js"></script>
    <script src="../lib/xqi18n.min.js"></script>
    <script src="../lib/vue/xqi18n.min.js"></script>
    <script type="module">
        import { createCheckRunner, assert } from './checks.js';

        const runner = createCheckRunner({ page: 'vue3' });
        const runtimeReady = typeof window.Vue === 'object' && /^3\./.test(window.Vue.version || '');

        const messages = {
            zhCn: { name: '快乐', a: { b: { c: '深层' } } },
            enUs: { name: 'happy', a: { b: { c: 'nested' } } },
        };

        const probe = {
            inject: ['xqi18n'],
            template: '<em class="vue-inject">{{ xqi18n.tns("name") }}</em>',
        };

        const template = `
            <div class="demo-panel">
                <p class="demo-line"><span>name</span><strong class="vue-value">{{ $t('name') }}</strong></p>
                <p class="demo-line"><span>a.b.c (nested)</span><strong class="vue-nested">{{ $t('a.b.c') }}</strong></p>
                <p class="demo-line"><span>inject('xqi18n')</span><strong class="vue-inject-host"><probe></probe></strong></p>
            </div>`;

        const checks = [['Vue 3 runtime is available', () => {
            assert(runtimeReady, 'Vue 3 CDN did not load (offline?)');
        }]];

        if (runtimeReady) {
            const Vue = window.Vue;
            const i18n = new window.xqi18n({ lang: 'zhCn', messages, warn: false });

            const mount = (host) => {
                const target = document.createElement('div');
                host.append(target);
                const app = Vue.createApp({ template, components: { probe } });
                app.use(window.xqi18nVue, { i18n });
                app.mount(target);
                return app;
            };

            checks.push(
                ['plugin installs through app.use', () => {
                    const app = Vue.createApp({ template: '<div />' });
                    app.use(window.xqi18nVue, { i18n });
                    const globals = app.config.globalProperties;
                    assert(typeof globals.$t === 'function', '$t was not installed');
                    assert(globals.$xqi18n === i18n, '$xqi18n was not installed');
                    assert(globals.$t('name') === '快乐', '$t returned the wrong value');
                    app.unmount();
                }],
                ['the template renders the translation', async () => {
                    const host = document.createElement('div');
                    const app = mount(host);
                    await Vue.nextTick();
                    const text = host.querySelector('.vue-value').textContent.trim();
                    app.unmount();
                    assert(text === '快乐', `expected 快乐, found ${text}`);
                }],
                ['inject() reaches the same instance', async () => {
                    const host = document.createElement('div');
                    const app = mount(host);
                    await Vue.nextTick();
                    const text = host.querySelector('.vue-inject').textContent.trim();
                    app.unmount();
                    assert(text === '快乐', `inject('xqi18n') returned ${text}`);
                }],
                ['changing lang re-renders without a reload', async () => {
                    const host = document.createElement('div');
                    const app = mount(host);
                    await Vue.nextTick();
                    i18n.lang = 'enUs';
                    await Vue.nextTick();
                    const name = host.querySelector('.vue-value').textContent.trim();
                    const nested = host.querySelector('.vue-nested').textContent.trim();
                    const injected = host.querySelector('.vue-inject').textContent.trim();
                    app.unmount();
                    assert(name === 'happy', `name did not update, found ${name}`);
                    assert(nested === 'nested', `nested key did not update, found ${nested}`);
                    assert(injected === 'happy', `inject() did not update, found ${injected}`);
                }],
                ['an unmounted app unsubscribes silently', async () => {
                    const host = document.createElement('div');
                    const app = mount(host);
                    await Vue.nextTick();
                    app.unmount();
                    i18n.lang = 'zhCn';
                    await Vue.nextTick();
                    assert(host.querySelector('.vue-value') === null, 'a dead app still rendered');
                }],
            );

            await runner.run(checks);

            // The suite unmounts its throwaway apps; restore a live demo.
            const demoHost = document.querySelector('#vue-demo');
            mount(demoHost);
            await Vue.nextTick();
            for (const button of document.querySelectorAll('[data-lang]')) {
                button.addEventListener('click', () => {
                    i18n.lang = button.dataset.lang;
                });
            }
            assert(demoHost.querySelector('.vue-value'), 'the demo did not mount');
            runner.markDemoReady();
        } else {
            await runner.run(checks);
            document.querySelector('#details').textContent += ' Live demo skipped: no Vue 3 runtime.';
        }
    </script>
</body>

</html>
